name: Build Standalone Binaries

on:
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab
  release:
    types: [created]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: syncpty-linux
            node_url: "https://nodejs.org/dist/v20.15.0/node-v20.15.0-linux-x64.tar.xz"
          - os: windows-latest
            artifact_name: syncpty-windows.exe
            node_url: "https://nodejs.org/dist/v20.15.0/node-v20.15.0-win-x64.zip"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build Typescript
        run: pnpm install && pnpm run build

      - name: Build Payload
        shell: bash
        run: bash master-build.sh

      - name: Download Portable Node 24 Binary
        shell: bash
        run: |
          mkdir -p node-bin
          # Download and extract the raw Node executable into the node-bin folder
          if [ "${{ runner.os }}" == "Windows" ]; then
            curl -o node.zip "${{ matrix.node_url }}"
            unzip -j node.zip "*/node.exe" -d node-bin/
          else
            curl -o node.tar.xz "${{ matrix.node_url }}"
            # Added --wildcards to safely extract the binary
            tar -xf node.tar.xz --wildcards --strip-components=2 -C node-bin/ "*/bin/node"
          fi

      - name: Compile Go Wrapper
        shell: bash
        run: |
          go mod init syncpty || true
          go build -o ${{ matrix.artifact_name }} main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
