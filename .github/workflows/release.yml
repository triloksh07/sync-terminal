name: Build Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: syncpty-linux
            # Upgraded to Node 24.16.0 Linux binary
            node_url: "https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.xz"
          - os: windows-latest
            artifact_name: syncpty-windows.exe
            # Upgraded to Node 24.16.0 Windows binary
            node_url: "https://nodejs.org/dist/v24.16.0/node-v24.16.0-win-x64.zip"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build Typescript
        run: pnpm install && pnpm run build

      - name: Build Payload
        shell: bash
        run: bash master-build.sh

      - name: Download Portable Node 24 Binary
        shell: bash
        run: |
          mkdir -p node-bin
          # Download and extract the raw Node executable into the node-bin folder
          if [ "${{ runner.os }}" == "Windows" ]; then
            curl -o node.zip "${{ matrix.node_url }}"
            unzip -j node.zip "*/node.exe" -d node-bin/
          else
            curl -o node.tar.xz "${{ matrix.node_url }}"
            # Added --wildcards to safely extract the binary
            tar -xf node.tar.xz --wildcards --strip-components=2 -C node-bin/ "*/bin/node"
          fi

      - name: Compile Go Wrapper with Dynamic Version
        shell: bash
        run: |
          go mod init syncpty || true
          # The -ldflags inject the GitHub tag (e.g., v1.0.0) into the Go Version variable
          # The -s -w flags strip debug info to make the final binary smaller
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ${{ matrix.artifact_name }} main.go

      - name: Upload Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        # Only create/upload to a release if this was triggered by a Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
