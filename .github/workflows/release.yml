name: Build and Publish Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # STAGE A: THE FACTORY (Parallel Execution)
  # Compiles code on isolated VMs and stashes
  # the binaries in temporary internal lockers.
  # ==========================================
  build_artifacts:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux Target
          - os: ubuntu-latest
            artifact_name: syncpty-linux
            node_url: "https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.xz"
          
          # Windows Target
          - os: windows-latest
            artifact_name: syncpty-windows.exe
            node_url: "https://nodejs.org/dist/v24.16.0/node-v24.16.0-win-x64.zip"
          
          # macOS Apple Silicon (M-Series) Target
          - os: macos-latest
            artifact_name: syncpty-macos-arm64
            node_url: "https://nodejs.org/dist/v24.16.0/node-v24.16.0-darwin-arm64.tar.gz"
            
          # macOS Intel Target
          - os: macos-13 
            artifact_name: syncpty-macos-amd64
            node_url: "https://nodejs.org/dist/v24.16.0/node-v24.16.0-darwin-x64.tar.gz"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install Dependencies
        run: npm install -g pnpm

      - name: Build Typescript
        run: pnpm install && pnpm run build

      - name: Build Payload
        shell: bash
        run: bash master-build.sh

      - name: Download and Extract Portable Node
        shell: bash
        run: |
          mkdir -p node-bin temp-ext
          
          if [ "${{ runner.os }}" == "Windows" ]; then
            curl -L -o node.zip "${{ matrix.node_url }}"
            unzip -q -j node.zip "*/node.exe" -d node-bin/
          else
            # Use capital -O to preserve the original filename from the URL (.tar.gz vs .tar.xz)
            curl -L -O "${{ matrix.node_url }}"
            FILENAME=$(basename "${{ matrix.node_url }}")
            
            # Extract quietly to a temporary folder to bypass bsdtar wildcard issues
            tar -xf "$FILENAME" -C temp-ext
            
            # Find the inner executable and securely move it to the target directory
            find temp-ext -type f -name "node" -exec mv {} node-bin/ \;
          fi
          
          # Maintain ephemeral runner hygiene
          rm -rf temp-ext node.zip *.tar.*

      - name: Compile Go Wrapper with Dynamic Version
        shell: bash
        run: |
          go mod init syncpty || true
          # The -ldflags inject the GitHub tag (e.g., v1.0.0) into the Go Version variable
          # The -s -w flags strip debug info to make the final binary smaller
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ${{ matrix.artifact_name }} main.go

      - name: Inject Version into Artifact Filename
        shell: bash
        run: |
          # Extract the Git tag that triggered the run
          VERSION=${{ github.ref_name }}
          
          # Preserve the .exe extension explicitly for Windows targets
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            TARGET_NAME="syncpty-windows-${VERSION}.exe"
            mv syncpty-windows.exe "$TARGET_NAME"
          else
            TARGET_NAME="${{ matrix.artifact_name }}-${VERSION}"
            mv ${{ matrix.artifact_name }} "$TARGET_NAME"
          fi
          
          # Export to environment for the upload step
          echo "UPLOAD_NAME=$TARGET_NAME" >> $GITHUB_ENV

      - name: Stash Binary in Temporary Workspace
        uses: actions/upload-artifact@v4
        with:
          # Isolate each file in its own temporary locker
          name: ${{ env.UPLOAD_NAME }}
          path: ${{ env.UPLOAD_NAME }}
          # Automatically clear server storage to prevent bloat
          retention-days: 1 

  # ==========================================
  # STAGE B: THE PUBLISHER (Sequential Execution)
  # Waits for the factory, sweeps the internal
  # lockers, and executes a single API upload.
  # ==========================================
  publish_release:
    name: Publish Official Release
    # Force this job to wait until the factory matrix finishes entirely
    needs: build_artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Gatekeeper: Only execute the upload sweep if a formal tag was pushed
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Retrieve Binaries from Temporary Workspace
        uses: actions/download-artifact@v4
        with:
          # Gather all isolated artifacts into a single local directory
          path: ./dist
          # Flatten the structure so files are not nested in subfolders
          merge-multiple: true 
          
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
